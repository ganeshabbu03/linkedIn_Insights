services:
  - type: web
    name: linkedin-insights
    env: python
    region: ohio # or oregon, frankfurt etc.
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install
    startCommand: python run.py
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/pw-browsers
      - key: DATABASE_NAME
        value: linkedin_insights
      - key: MONGO_URL
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
